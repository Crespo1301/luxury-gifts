<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Luxury gifts template placeholder</title>
  <desc id="desc">Neutral placeholder artwork for a floral and gifting template.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7f4" />
      <stop offset="100%" stop-color="#f5e8de" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <circle cx="260" cy="220" r="190" fill="#f19aa6" fill-opacity="0.22" />
  <circle cx="940" cy="210" r="170" fill="#d4b15f" fill-opacity="0.18" />
  <circle cx="930" cy="710" r="220" fill="#f6c7cf" fill-opacity="0.2" />
  <rect x="170" y="200" width="860" height="500" rx="40" fill="none" stroke="#b68d38" stroke-opacity="0.35" stroke-width="4" />
  <text x="600" y="420" text-anchor="middle" fill="#2f241f" font-family="Georgia, serif" font-size="56">Luxury Gifts Template</text>
  <text x="600" y="490" text-anchor="middle" fill="#6b4f45" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">ADD CLIENT FLORALS, PRODUCTS, AND BRANDING</text>
